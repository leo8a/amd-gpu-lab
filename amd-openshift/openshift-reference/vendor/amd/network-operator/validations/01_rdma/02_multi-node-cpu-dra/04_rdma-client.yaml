---
apiVersion: batch/v1
kind: Job
metadata:
  name: rdma-client-cpu-dra
  namespace: openshift-amd-network
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: rdma-test-cpu-dra
        role: client
    spec:
      serviceAccountName: rdma-validator
      restartPolicy: Never
      nodeSelector:
        feature.node.kubernetes.io/amd-nic: "true"
      resourceClaims:
        - name: nic
          resourceClaimTemplateName: dra-nic-ionic0
      containers:
        - name: client
          image: quay.io/lochoa/amd-tools:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              echo "=== RDMA CPU-DRA Multi-Node Bandwidth Validation ==="

              echo "--- DRA device verification ---"
              RDMA_DEV=$(ibv_devices 2>/dev/null | awk '/ionic/{print $1}' | head -1)
              if [ -z "$RDMA_DEV" ]; then
                echo "FAIL: No ionic RDMA device found"
                ibv_devices 2>&1
                exit 1
              fi
              NIC_PCI=$(readlink -f /sys/class/infiniband/$RDMA_DEV/device 2>/dev/null | xargs basename)
              echo "Using: $RDMA_DEV (PCI: $NIC_PCI)"
              case "$NIC_PCI" in
                0000:09:00.0|0000:06:00.0) ;;
                *) echo "WARN: Expected rail-0 NIC (SMC 0000:09:00.0 / Dell 0000:06:00.0), got $NIC_PCI" ;;
              esac
              ibv_devinfo -d $RDMA_DEV 2>&1

              echo "--- configuring RDMA NIC IP ---"
              RDMA_NETDEV=$(ls /sys/class/infiniband/$RDMA_DEV/device/net/ 2>/dev/null | head -1)
              if [ -z "$RDMA_NETDEV" ]; then
                echo "FAIL: No network device for $RDMA_DEV"
                exit 1
              fi
              CLIENT_IP="192.168.101.11"
              ip addr add $CLIENT_IP/24 dev $RDMA_NETDEV
              ip link set $RDMA_NETDEV mtu 9000 up
              echo "Client IP: $CLIENT_IP on $RDMA_NETDEV"

              SERVER_IP="192.168.101.10"
              echo "--- waiting for server at $SERVER_IP ---"
              sleep 10
              timeout=60
              while [ $timeout -gt 0 ]; do
                if ping -c 1 -W 2 $SERVER_IP >/dev/null 2>&1; then
                  echo "Server reachable"
                  break
                fi
                sleep 2
                timeout=$((timeout - 2))
              done
              if [ $timeout -le 0 ]; then
                echo "FAIL: Server not reachable at $SERVER_IP"
                exit 1
              fi

              echo "--- ib_write_bw test ---"
              echo "Client: $CLIENT_IP -> Server: $SERVER_IP (device: $RDMA_DEV)"
              ib_write_bw -d $RDMA_DEV -i 1 -F -x 1 -q 8 -p 10000 \
                --tclass 96 --report_gbits -s 1048576 -D 10 \
                -l 64 -t 4096 -Q 1 $SERVER_IP
              if [ $? -ne 0 ]; then
                echo "FAIL: ib_write_bw failed"
                exit 1
              fi
              echo "=== PASS ==="
          resources:
            claims:
              - name: nic
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "NET_RAW", "NET_ADMIN"]
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: role
                    operator: In
                    values: ["server"]
              topologyKey: kubernetes.io/hostname
