# MachineConfig to disable PCIe ACS (Access Control Services) at boot
#
# Required for GPU Direct RDMA (GDR) on bare-metal systems with AMD GPUs
# and AMD Pensando Pollara AI NICs. ACS redirects P2P PCIe transactions
# through the root complex, which breaks direct GPU-to-NIC DMA.
#
# Reference: https://instinct.docs.amd.com/projects/gpu-cluster-networking/en/develop/how-to/single-node-config.html
# Script source: https://github.com/ROCm/cluster-networking/blob/main/general_scripts/dis_acs.sh
#
# Must run after every reboot — BIOS-level ACS disable alone is not sufficient.
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-amd-gpu-acs-disable-master
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/dis_acs.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: dis-acs.service
          enabled: true
          contents: |
            [Unit]
            Description=Disable PCIe Access Control Services (ACS) for AMD GPUs
            Documentation=https://instinct.docs.amd.com/projects/gpu-cluster-networking/en/develop/how-to/single-node-config.html
            DefaultDependencies=no
            After=sysinit.target
            Before=basic.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/dis_acs.sh
            RemainAfterExit=yes
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target

---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-amd-gpu-acs-disable-worker
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/dis_acs.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: dis-acs.service
          enabled: true
          contents: |
            [Unit]
            Description=Disable PCIe Access Control Services (ACS) for AMD GPUs
            Documentation=https://instinct.docs.amd.com/projects/gpu-cluster-networking/en/develop/how-to/single-node-config.html
            DefaultDependencies=no
            After=sysinit.target
            Before=basic.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/dis_acs.sh
            RemainAfterExit=yes
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target


# -----------------------------------------------------------------------------
# Verification
# -----------------------------------------------------------------------------
#
# Check ACS is disabled on all bridges:
# oc debug node/<node> -- chroot /host bash -c "lspci -vvv | grep -i 'ACSCtl:'"
# Expected output: If you see SrcValid+ among any of the outputs, then ACS isn't disabled.
#
# Check systemd service ran:
# oc debug node/<node> -- chroot /host systemctl status dis-acs.service
#
# Check journal logs:
# oc debug node/<node> -- chroot /host journalctl -u dis-acs.service
