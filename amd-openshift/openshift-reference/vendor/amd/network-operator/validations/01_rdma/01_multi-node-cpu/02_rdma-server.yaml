---
apiVersion: v1
kind: Pod
metadata:
  name: rdma-server
  namespace: openshift-amd-network
  annotations:
    k8s.v1.cni.cncf.io/networks: amd-rdma-net
  labels:
    app: rdma-test
    role: server
spec:
  serviceAccountName: rdma-validator
  restartPolicy: Never
  nodeSelector:
    feature.node.kubernetes.io/amd-nic: "true"
  containers:
    - name: server
      image: quay.io/lochoa/amd-tools:latest
      imagePullPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
          echo "=== RDMA Server Starting ==="
          echo "--- waiting for net1 ---"
          timeout=60
          while [ $timeout -gt 0 ]; do
            if ip addr show net1 2>/dev/null | grep -q "inet "; then
              SERVER_IP=$(ip addr show net1 | grep "inet " | awk '{print $2}' | cut -d/ -f1)
              echo "Server IP: $SERVER_IP"
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done
          if [ -z "$SERVER_IP" ]; then
            echo "FAIL: net1 not ready"
            exit 1
          fi

          echo "--- RDMA device ---"
          RDMA_DEV=$(ibv_devices 2>/dev/null | awk '/ionic/{print $1}' | head -1)
          if [ -z "$RDMA_DEV" ]; then
            echo "FAIL: No ionic RDMA device assigned to pod"
            ibv_devices 2>&1
            exit 1
          fi
          echo "Using: $RDMA_DEV"
          ibv_devinfo -d $RDMA_DEV 2>&1

          echo "--- starting ib_write_bw server on port 10000 ---"
          ib_write_bw -d $RDMA_DEV -i 1 -F -x 1 -q 4 -p 10000 \
            --tclass 96 --report_gbits -s 1048576 -D 10
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          amd.com/nic: "1"
        limits:
          cpu: 100m
          memory: 256Mi
          amd.com/nic: "1"
      securityContext:
        capabilities:
          add: ["IPC_LOCK", "NET_RAW"]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["client"]
          topologyKey: kubernetes.io/hostname
