name: gpu-operator (nightly validations)

on:
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages (0=install+DRA full-gpu, 1-2=partition, 3=DRA partitioned-gpu, 4-5=restore) or 'all'"
        required: false
        default: "0,1,2,3,4,5"

concurrency:
  group: gpu-validations
  cancel-in-progress: false

env:
  GPU_NAMESPACE: openshift-amd-gpu
  CI_TOOLS_IMAGE: quay.io/lochoa/ci-tools:latest
  OPERATOR_DIR: amd-openshift/openshift-reference/vendor/amd/gpu-operator
  VALIDATIONS_DIR: amd-openshift/openshift-reference/vendor/amd/gpu-operator/validations
  SMC6216GPU: smc6216gpu.partner-accelerators.redhat.lab
  SMC6217GPU: smc6217gpu.partner-accelerators.redhat.lab

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Preflight
  # ─────────────────────────────────────────────────────────────────────────────

  preflight:
    name: "Preflight: cleanup & connectivity"
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@v4

      - name: Check cluster connectivity
        run: |
          set -euo pipefail
          oc whoami
          oc version
          oc get nodes
          GPU_NODES=$(oc get nodes -l feature.node.kubernetes.io/amd-gpu=true --no-headers | wc -l)
          echo "AMD GPU nodes: $GPU_NODES"
          if [[ $GPU_NODES -lt 1 ]]; then
            echo "::error::No AMD GPU nodes found"
            exit 1
          fi

      - name: Cleanup previous operator install
        run: bash ${OPERATOR_DIR}/cleanup.sh || true

      - name: Determine stages to run
        id: plan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGES_TO_RUN="${{ inputs.stages }}"
            [[ "$STAGES_TO_RUN" == "all" ]] && STAGES_TO_RUN="0,1,2,3,4,5"
          else
            STAGES_TO_RUN="0,1,2,3,4,5"
          fi

          echo "stages=$STAGES_TO_RUN" >> "$GITHUB_OUTPUT"
          echo "Stages: $STAGES_TO_RUN"

  # ─────────────────────────────────────────────────────────────────────────────
  # Install GPU Operator
  # ─────────────────────────────────────────────────────────────────────────────

  install-gpu-operator:
    name: "Install: AMD GPU Operator"
    needs: preflight
    if: contains(needs.preflight.outputs.stages, '0')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy GPU operator
        run: |
          set -euo pipefail
          # First pass: CRD-dependent resources (DeviceConfig) will fail before the CSV installs CRDs
          oc apply -k ${OPERATOR_DIR}/ || true
          # Wait for OLM to install CSV and register CRDs
          echo "Waiting for DeviceConfig CRD..."
          timeout 120 bash -c 'until oc get crd/deviceconfigs.amd.com >/dev/null 2>&1; do sleep 5; done'
          # Second pass: CRDs now exist, DeviceConfig succeeds
          oc apply -k ${OPERATOR_DIR}/
      - name: Wait for device plugin
        run: |
          set -euo pipefail
          sleep 30
          oc rollout status daemonset/amdgpu-driver-install-device-plugin \
            -n ${GPU_NAMESPACE} --timeout=180s

  # ─────────────────────────────────────────────────────────────────────────────
  # DRA Full GPU (runs first — GPUs are in default SPX state)
  # ─────────────────────────────────────────────────────────────────────────────

  dra-full-gpu:
    name: "DRA: Full GPU"
    needs: [preflight, install-gpu-operator]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '0')
      && needs.install-gpu-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run full-gpu validation
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/02_dra \
            ${CI_TOOLS_IMAGE} make full-gpu NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # DCM Partitioning
  # ─────────────────────────────────────────────────────────────────────────────

  partition-smc6216gpu:
    name: "DCM: Partition smc6216gpu (CPX+NPS4)"
    needs: [preflight, install-gpu-operator, dra-full-gpu]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '1')
      && needs.install-gpu-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Partition to CPX + NPS4
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make all \
              NODE_NAME=${SMC6216GPU} PROFILE_NAME=cpx-profile-nps4 NAMESPACE=${GPU_NAMESPACE}

  partition-smc6217gpu:
    name: "DCM: Partition smc6217gpu (DPX+NPS2)"
    needs: [preflight, install-gpu-operator, dra-full-gpu]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '2')
      && needs.install-gpu-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Partition to DPX + NPS2
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make all \
              NODE_NAME=${SMC6217GPU} PROFILE_NAME=dpx-profile-nps2 NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # DRA Partitioned GPU (runs while GPUs are partitioned)
  # ─────────────────────────────────────────────────────────────────────────────

  dra-partitioned-gpu:
    name: "DRA: Partitioned GPU"
    needs: [preflight, partition-smc6216gpu, partition-smc6217gpu]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '3')
      && needs.partition-smc6216gpu.result == 'success'
      && needs.partition-smc6217gpu.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run partitioned-gpu validation
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/02_dra \
            ${CI_TOOLS_IMAGE} make partitioned-gpu NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # Restore Defaults
  # ─────────────────────────────────────────────────────────────────────────────

  restore-smc6216gpu:
    name: "DCM: Restore smc6216gpu (SPX+NPS1)"
    needs: [preflight, install-gpu-operator, dra-partitioned-gpu]
    continue-on-error: true
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '4')
      && needs.install-gpu-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore to SPX + NPS1 (default)
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make all \
              NODE_NAME=${SMC6216GPU} PROFILE_NAME=spx-profile-nps1 NAMESPACE=${GPU_NAMESPACE}

  restore-smc6217gpu:
    name: "DCM: Restore smc6217gpu (SPX+NPS1)"
    needs: [preflight, install-gpu-operator, dra-partitioned-gpu]
    continue-on-error: true
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '5')
      && needs.install-gpu-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore to SPX + NPS1 (default)
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make all \
              NODE_NAME=${SMC6217GPU} PROFILE_NAME=spx-profile-nps1 NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # Cleanup
  # ─────────────────────────────────────────────────────────────────────────────

  cleanup:
    needs: [install-gpu-operator, dra-full-gpu, partition-smc6216gpu, partition-smc6217gpu, dra-partitioned-gpu, restore-smc6216gpu, restore-smc6217gpu]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore base DeviceConfig and remove DCM
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR} \
            ${CI_TOOLS_IMAGE} bash -c "
              make -C 02_dra cleanup NAMESPACE=${GPU_NAMESPACE} || true
              make -C 00_partitioning-dcm cleanup NODE_NAME=${SMC6216GPU} NAMESPACE=${GPU_NAMESPACE} || true
              make -C 00_partitioning-dcm cleanup NODE_NAME=${SMC6217GPU} NAMESPACE=${GPU_NAMESPACE} || true
            "
