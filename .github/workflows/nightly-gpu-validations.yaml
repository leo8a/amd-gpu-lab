name: gpu-operator (nightly validations)

on:
  schedule:
    - cron: "0 2 * * *"  # 3am CET
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated DRA stages (0=full-gpu, 1=partitioned-gpu) or 'all'"
        required: false
        default: "all"

concurrency:
  group: gpu-validations
  cancel-in-progress: false

env:
  GPU_NAMESPACE: openshift-amd-gpu
  CI_TOOLS_IMAGE: quay.io/lochoa/ci-tools:latest
  VALIDATIONS_DIR: amd-openshift/openshift-reference/vendor/amd/gpu-operator/validations
  SMC6216GPU: smc6216gpu.partner-accelerators.redhat.lab
  SMC6217GPU: smc6217gpu.partner-accelerators.redhat.lab

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Preflight
  # ─────────────────────────────────────────────────────────────────────────────

  preflight:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - name: Check cluster connectivity
        run: |
          set -euo pipefail
          oc whoami
          oc version
          oc get nodes
          GPU_NODES=$(oc get nodes -l feature.node.kubernetes.io/amd-gpu=true --no-headers | wc -l)
          echo "AMD GPU nodes: $GPU_NODES"
          if [[ $GPU_NODES -lt 1 ]]; then
            echo "::error::No AMD GPU nodes found"
            exit 1
          fi

      - name: Determine stages to run
        id: plan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGES_TO_RUN="${{ inputs.stages }}"
            [[ "$STAGES_TO_RUN" == "all" ]] && STAGES_TO_RUN="0,1"
          else
            STAGES_TO_RUN="0"

            PARTITIONED_NODES=$(oc get nodes \
              -l "feature.node.kubernetes.io/amd-gpu=true,dcm.amd.com/gpu-config-profile=cpx-profile-nps4,dcm.amd.com/gpu-config-profile-state=success" \
              --no-headers 2>/dev/null || true)

            if [[ -n "$PARTITIONED_NODES" ]]; then
              echo "DCM partitioned GPU nodes detected:"
              echo "$PARTITIONED_NODES"
              STAGES_TO_RUN="0,1"
            else
              echo "No DCM partitioned GPU nodes found, skipping partitioned-gpu stage"
            fi
          fi

          echo "stages=$STAGES_TO_RUN" >> "$GITHUB_OUTPUT"
          echo "DRA stages: $STAGES_TO_RUN"

  # ─────────────────────────────────────────────────────────────────────────────
  # DCM Partitioning
  # ─────────────────────────────────────────────────────────────────────────────

  dcm-deploy:
    needs: preflight
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy DCM
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make deploy-dcm NAMESPACE=${GPU_NAMESPACE} NODE_NAME=${SMC6216GPU}

  partition-smc6216gpu:
    needs: dcm-deploy
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Partition to SPX + NPS1
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make taint label verify untaint \
              NODE_NAME=${SMC6216GPU} PROFILE_NAME=spx-profile-nps1 NAMESPACE=${GPU_NAMESPACE}

  partition-smc6217gpu:
    needs: dcm-deploy
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Partition to DPX + NPS2
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make taint label verify untaint \
              NODE_NAME=${SMC6217GPU} PROFILE_NAME=dpx-profile-nps2 NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # Restore Defaults
  # ─────────────────────────────────────────────────────────────────────────────

  restore-smc6216gpu:
    needs: [partition-smc6216gpu, partition-smc6217gpu]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore to CPX + NPS4 (default)
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make taint label verify untaint \
              NODE_NAME=${SMC6216GPU} PROFILE_NAME=cpx-profile-nps4 NAMESPACE=${GPU_NAMESPACE}

  restore-smc6217gpu:
    needs: [partition-smc6216gpu, partition-smc6217gpu]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore to SPX + NPS1 (default)
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/00_partitioning-dcm \
            ${CI_TOOLS_IMAGE} make taint label verify untaint \
              NODE_NAME=${SMC6217GPU} PROFILE_NAME=spx-profile-nps1 NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # DRA Validation
  # ─────────────────────────────────────────────────────────────────────────────

  dra-setup:
    needs: [restore-smc6216gpu, restore-smc6217gpu]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enable DRA on DeviceConfig
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/02_dra \
            ${CI_TOOLS_IMAGE} make enable-dra NAMESPACE=${GPU_NAMESPACE}

  dra-full-gpu:
    needs: [preflight, dra-setup]
    if: contains(needs.preflight.outputs.stages, '0')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run full-gpu validation
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/02_dra \
            ${CI_TOOLS_IMAGE} make full-gpu NAMESPACE=${GPU_NAMESPACE}

  dra-partitioned-gpu:
    needs: [preflight, dra-setup]
    if: contains(needs.preflight.outputs.stages, '1')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run partitioned-gpu validation
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/02_dra \
            ${CI_TOOLS_IMAGE} make partitioned-gpu NAMESPACE=${GPU_NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # Cleanup
  # ─────────────────────────────────────────────────────────────────────────────

  cleanup:
    needs: [dcm-deploy, partition-smc6216gpu, partition-smc6217gpu, restore-smc6216gpu, restore-smc6217gpu, dra-setup, dra-full-gpu, dra-partitioned-gpu]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore base DeviceConfig and remove DCM
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR} \
            ${CI_TOOLS_IMAGE} bash -c "
              make -C 02_dra cleanup NAMESPACE=${GPU_NAMESPACE} || true
              make -C 00_partitioning-dcm cleanup NODE_NAME=${SMC6216GPU} NAMESPACE=${GPU_NAMESPACE} || true
              make -C 00_partitioning-dcm cleanup NODE_NAME=${SMC6217GPU} NAMESPACE=${GPU_NAMESPACE} || true
            "
