name: network-operator (nightly validations)

on:
  schedule:
    - cron: "0 3 * * *"  # 4am CET
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages (0=rdma-single, 1=rdma-multi, 2=cluster-validation) or 'all'"
        required: false
        default: "all"

concurrency:
  group: network-validations
  cancel-in-progress: false

env:
  NAMESPACE: openshift-amd-network
  CI_TOOLS_IMAGE: quay.io/lochoa/ci-tools:latest
  VALIDATIONS_DIR: amd-openshift/openshift-reference/vendor/amd/network-operator/validations

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Preflight
  # ─────────────────────────────────────────────────────────────────────────────

  preflight:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - name: Check cluster connectivity
        run: |
          set -euo pipefail
          oc whoami
          oc version
          oc get nodes
          NODE_COUNT=$(oc get nodes -l feature.node.kubernetes.io/amd-nic=true --no-headers | wc -l)
          echo "AMD NIC nodes: $NODE_COUNT"
          if [[ $NODE_COUNT -lt 1 ]]; then
            echo "::error::No AMD NIC nodes found"
            exit 1
          fi

      - name: Verify device plugin resources
        run: |
          set -euo pipefail
          if ! oc get cm -n "$NAMESPACE" amd-network-operator-device-plugin-config &>/dev/null; then
            echo "::error::Device plugin ConfigMap missing — apply it with: oc apply -f vendor/amd/network-operator/07_amd-device-plugin-config.yaml"
            exit 1
          fi

          NIC_TOTAL=$(oc get nodes -l feature.node.kubernetes.io/amd-nic=true \
            -o jsonpath='{range .items[*]}{.status.allocatable.amd\.com/nic}{"\n"}{end}' \
            | awk '{s+=$1} END {print s+0}')
          echo "Total amd.com/nic allocatable: $NIC_TOTAL"
          if [[ "$NIC_TOTAL" -lt 1 ]]; then
            echo "::error::No amd.com/nic resources — device plugin may need a restart (oc delete pods -n $NAMESPACE -l app.kubernetes.io/name=device-plugin)"
            exit 1
          fi

      - name: Determine stages to run
        id: plan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGES_TO_RUN="${{ inputs.stages }}"
            [[ "$STAGES_TO_RUN" == "all" ]] && STAGES_TO_RUN="0,1,2"
          else
            STAGES_TO_RUN="0,1,2"
          fi

          echo "stages=$STAGES_TO_RUN" >> "$GITHUB_OUTPUT"
          echo "Stages: $STAGES_TO_RUN"

  # ─────────────────────────────────────────────────────────────────────────────
  # RDMA Validation
  # ─────────────────────────────────────────────────────────────────────────────

  rdma-single-pod:
    needs: preflight
    if: contains(needs.preflight.outputs.stages, '0')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run single-pod RDMA test
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/01_rdma \
            ${CI_TOOLS_IMAGE} make single-pod NAMESPACE=${NAMESPACE}

  rdma-multi-node:
    needs: [preflight, rdma-single-pod]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '1')
      && (needs.rdma-single-pod.result == 'success' || needs.rdma-single-pod.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run multi-node RDMA bandwidth test
        run: |
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/01_rdma \
            ${CI_TOOLS_IMAGE} make multi-node NAMESPACE=${NAMESPACE}

  # ─────────────────────────────────────────────────────────────────────────────
  # Cluster Validation
  # ─────────────────────────────────────────────────────────────────────────────

  cluster-validation:
    needs: [preflight, rdma-single-pod, rdma-multi-node]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '2')
      && (needs.rdma-multi-node.result == 'success' || needs.rdma-multi-node.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and run cluster validation
        run: |
          set -euo pipefail
          oc apply --server-side -k "${VALIDATIONS_DIR}/02_cluster-validation"
          oc wait --for=condition=established crd/mpijobs.kubeflow.org --timeout=180s

          JOB_NAME="cluster-validation-ci-$(date +%s)"
          oc create job "$JOB_NAME" --from=cronjob/cluster-validation-cron-job -n default
          oc label job "$JOB_NAME" -n default ci-triggered=true

          for node in $(oc get nodes -l feature.node.kubernetes.io/amd-nic=true -o name); do
            oc annotate "$node" amd.com/cluster-validation-last-run-timestamp- 2>/dev/null || true
          done

          JOB_POD=$(oc get pods -n default -l job-name="$JOB_NAME" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          echo "Waiting for submit-mpijob container to complete (pod: $JOB_POD)..."
          SECONDS=0
          while [[ $SECONDS -lt 1500 ]]; do
            STATE=$(oc get pod "$JOB_POD" -n default \
              -o jsonpath='{.status.containerStatuses[?(@.name=="submit-mpijob")].state}' 2>/dev/null)
            if echo "$STATE" | grep -q "terminated"; then
              EXIT_CODE=$(oc get pod "$JOB_POD" -n default \
                -o jsonpath='{.status.containerStatuses[?(@.name=="submit-mpijob")].state.terminated.exitCode}' 2>/dev/null)
              echo "submit-mpijob exited with code $EXIT_CODE"
              if [[ "$EXIT_CODE" != "0" ]]; then
                echo "FAIL: Cluster validation job failed"
                oc logs -n default "$JOB_POD" -c submit-mpijob 2>/dev/null || true
                exit 1
              fi
              break
            fi
            sleep 10
          done
          if [[ $SECONDS -ge 1500 ]]; then
            echo "FAIL: Cluster validation job did not complete within 25 minutes"
            oc logs -n default "$JOB_POD" -c submit-mpijob 2>/dev/null || true
            exit 1
          fi

          PASSED_COUNT=$(oc get nodes -l amd.com/cluster-validation-status=passed --no-headers 2>/dev/null | wc -l)
          if [[ "$PASSED_COUNT" -ge 1 ]]; then
            echo "PASS: $PASSED_COUNT node(s) passed cluster validation"
          else
            echo "FAIL: No nodes have cluster-validation-status=passed"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Cleanup
  # ─────────────────────────────────────────────────────────────────────────────

  cleanup:
    needs: [preflight, rdma-single-pod, rdma-multi-node, cluster-validation]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup all test resources
        run: |
          set -uo pipefail
          podman run --rm --network=host \
            -v "$GITHUB_WORKSPACE:/workspace:z" \
            -v "$HOME/.kube:/root/.kube:z" \
            -w /workspace/${VALIDATIONS_DIR}/01_rdma \
            ${CI_TOOLS_IMAGE} make cleanup NAMESPACE=${NAMESPACE} || true

          oc delete -k "${VALIDATIONS_DIR}/02_cluster-validation" --ignore-not-found=true 2>/dev/null || true
          oc delete job -l ci-triggered=true -n default --ignore-not-found=true 2>/dev/null || true
          oc delete job -l amd.com/cluster-validation-created=true -n default --ignore-not-found=true 2>/dev/null || true
          oc label nodes --all \
            amd.com/cluster-validation-status- \
            amd.com/cluster-validation-candidate- \
            amd.com/gpu-validation-test- \
            2>/dev/null || true
          echo "Cleanup complete"
