name: network-operator (nightly validations)

on:
  schedule:
    - cron: "0 1 * * *"  # 01:00 UTC
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages (0=install, 1=rdma-single, 2=rdma-multi-cpu, 3=rdma-multi-gdr, 4=rdma-multi-gdr-dra, 5=cvf) or 'all'"
        required: false
        default: "all"

concurrency:
  group: network-validations
  cancel-in-progress: false

env:
  NAMESPACE: openshift-amd-network
  OPERATOR_DIR: amd-openshift/openshift-reference/vendor/amd/network-operator
  VALIDATIONS_DIR: amd-openshift/openshift-reference/vendor/amd/network-operator/validations

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Preflight
  # ─────────────────────────────────────────────────────────────────────────────

  preflight:
    name: "Preflight: cleanup & connectivity"
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@v4

      - name: Check cluster connectivity
        run: |
          set -euo pipefail
          oc whoami
          oc version
          oc get nodes

      - name: Cleanup previous operator install
        run: bash ${OPERATOR_DIR}/cleanup.sh || true

      - name: Determine stages to run
        id: plan
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGES="${{ inputs.stages }}"
            [[ "$STAGES" == "all" ]] && STAGES="0,1,2,3,4,5"
          else
            STAGES="0,1,2,3,4,5"
          fi
          echo "stages=$STAGES" >> "$GITHUB_OUTPUT"
          echo "Stages: $STAGES"

  # ─────────────────────────────────────────────────────────────────────────────
  # Install Network Operator
  # ─────────────────────────────────────────────────────────────────────────────

  install-network-operator:
    name: "Install: AMD Network Operator"
    needs: preflight
    if: contains(needs.preflight.outputs.stages, '0')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy network operator
        run: |
          set -euo pipefail
          # First pass: CRD-dependent resources (NetworkConfig) will fail before the CSV installs CRDs
          oc apply -k ${OPERATOR_DIR}/ || true
          # Second pass: CRDs now exist, NetworkConfig succeeds
          oc apply -k ${OPERATOR_DIR}/
      - name: Wait for device plugin
        run: |
          set -euo pipefail
          sleep 30
          oc wait pods -n ${NAMESPACE} -l app.kubernetes.io/name=device-plugin \
            --for=condition=ready --timeout=180s

  # ─────────────────────────────────────────────────────────────────────────────
  # RDMA Validations
  # ─────────────────────────────────────────────────────────────────────────────

  rdma-single-pod:
    name: "RDMA: Single Pod"
    needs: [preflight, install-network-operator]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '1')
      && needs.install-network-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make -C ${VALIDATIONS_DIR}/01_rdma single-pod
      - name: Cleanup
        if: always()
        run: make -C ${VALIDATIONS_DIR}/01_rdma cleanup

  rdma-multi-node-cpu:
    name: "RDMA: Multi-Node CPU"
    needs: [preflight, install-network-operator, rdma-single-pod]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '2')
      && needs.install-network-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make -C ${VALIDATIONS_DIR}/01_rdma multi-node-cpu
      - name: Cleanup
        if: always()
        run: make -C ${VALIDATIONS_DIR}/01_rdma cleanup

  rdma-multi-node-gdr:
    name: "RDMA: Multi-Node GDR"
    needs: [preflight, install-network-operator, rdma-multi-node-cpu]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '3')
      && needs.install-network-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make -C ${VALIDATIONS_DIR}/01_rdma multi-node-gdr
      - name: Cleanup
        if: always()
        run: make -C ${VALIDATIONS_DIR}/01_rdma cleanup

  rdma-multi-node-gdr-dra:
    name: "RDMA: Multi-Node GDR + DRA"
    needs: [preflight, install-network-operator, rdma-multi-node-gdr]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '4')
      && needs.install-network-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make -C ${VALIDATIONS_DIR}/01_rdma multi-node-gdr-dra
      - name: Cleanup
        if: always()
        run: make -C ${VALIDATIONS_DIR}/01_rdma cleanup

  # ─────────────────────────────────────────────────────────────────────────────
  # Cluster Validation Framework (CVF)
  # ─────────────────────────────────────────────────────────────────────────────

  cluster-validation:
    name: "CVF: RCCL Multi-Node Collective Comms"
    needs: [preflight, install-network-operator, rdma-multi-node-gdr-dra]
    if: >-
      always()
      && contains(needs.preflight.outputs.stages, '5')
      && needs.install-network-operator.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: make -C ${VALIDATIONS_DIR}/02_cvf deploy
      - name: Run
        run: make -C ${VALIDATIONS_DIR}/02_cvf run
      - name: Results
        run: make -C ${VALIDATIONS_DIR}/02_cvf status
      - name: Teardown
        if: always()
        run: make -C ${VALIDATIONS_DIR}/02_cvf teardown
