---
apiVersion: v1
kind: Pod
metadata:
  name: rdma-server-cpu
  namespace: openshift-amd-network
  annotations:
    k8s.v1.cni.cncf.io/networks: amd-rdma-net
  labels:
    app: rdma-test
    role: server
spec:
  serviceAccountName: rdma-validator
  restartPolicy: Never
  nodeSelector:
    feature.node.kubernetes.io/amd-nic: "true"
  containers:
    - name: server
      image: quay.io/lochoa/amd-tools:latest
      imagePullPolicy: Always
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      command: ["sh", "-c"]
      args:
        - |
          echo "=== RDMA Server Starting ==="

          echo "--- configuring IP from NIC VLAN ---"
          PCI=$(readlink /sys/class/net/net1/device 2>/dev/null | xargs basename | sed 's/^0000://')
          case "$PCI" in
            09:00.0) SUBNET=101 ;; 19:00.0) SUBNET=102 ;;
            79:00.0) SUBNET=103 ;; 69:00.0) SUBNET=104 ;;
            89:00.0) SUBNET=105 ;; 99:00.0) SUBNET=106 ;;
            f9:00.0) SUBNET=107 ;;
            *) echo "FAIL: unknown PCI $PCI"; exit 1 ;;
          esac
          case "$NODE_NAME" in *6216*) OCTET=11 ;; *6217*) OCTET=12 ;; *) echo "FAIL: unknown node $NODE_NAME"; exit 1 ;; esac
          SERVER_IP="192.168.${SUBNET}.${OCTET}"
          ip addr flush dev net1 2>/dev/null || true
          ip addr add "${SERVER_IP}/24" dev net1
          ip link set net1 up
          GW="192.168.${SUBNET}.254"
          for s in $(seq 101 107); do
            [ "$s" = "$SUBNET" ] && continue
            ip route add "192.168.${s}.0/24" via "$GW" dev net1 2>/dev/null || true
          done
          echo "Server IP: $SERVER_IP (PCI: $PCI, VLAN: $SUBNET)"

          echo "--- RDMA device ---"
          RDMA_DEV=$(ibv_devices 2>/dev/null | awk '/ionic/{print $1}' | head -1)
          if [ -z "$RDMA_DEV" ]; then
            echo "FAIL: No ionic RDMA device assigned to pod"
            ibv_devices 2>&1
            exit 1
          fi
          echo "Using: $RDMA_DEV"
          ibv_devinfo -d $RDMA_DEV 2>&1

          echo "--- starting ib_write_bw server on port 10000 ---"
          ib_write_bw -d $RDMA_DEV -i 1 -F -x 1 -q 8 -p 10000 \
            --tclass 96 --report_gbits -s 1048576 -D 10 \
            -l 64 -t 4096 -Q 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          amd.com/nic: "1"
        limits:
          cpu: 100m
          memory: 256Mi
          amd.com/nic: "1"
      securityContext:
        capabilities:
          add: ["IPC_LOCK", "NET_RAW", "NET_ADMIN"]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["client"]
          topologyKey: kubernetes.io/hostname
