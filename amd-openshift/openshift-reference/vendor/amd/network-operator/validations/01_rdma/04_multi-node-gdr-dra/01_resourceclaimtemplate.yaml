# ResourceClaimTemplate requesting one AMD GPU and the rail-1 RDMA NIC
# (subnet 102), constrained to the same PCIe root complex via DRA matchAttribute
# so GPUDirect RDMA stays on-root. Both server and client reference this same
# template, so they pin the SAME rail -> same L2 segment, no cross-rail routing.
# The rail-1 NIC PCI address differs per lab; only one exists on a given
# cluster, so matching either is safe (both map to subnet 102, both GPU-aligned):
#   - Supermicro MI325X (smc6216/smc6217): 0000:19:00.0 (root pci0000:10)
#   - Dell MI355X (dell-mi355x-3/4):        0000:3a:00.0 (root pci0000:32)
#
# Requires: AMD GPU DRA driver (gpu.amd.com) + DRANET (dra.net) both
# publishing resource.kubernetes.io/pcieRoot in their ResourceSlices.
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: dra-gpu-nic-aligned
  namespace: openshift-amd-network
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            count: 1
            selectors:
              - cel:
                  expression: "device.attributes['gpu.amd.com'].type == 'amdgpu'"
        - name: nic
          exactly:
            deviceClassName: dranet
            count: 1
            selectors:
              - cel:
                  expression: >-
                    device.attributes['dra.net'].rdma == true &&
                    (device.attributes['dra.net'].pciAddress == '0000:19:00.0' ||
                     device.attributes['dra.net'].pciAddress == '0000:3a:00.0')
      constraints:
        - requests: [gpu, nic]
          matchAttribute: "resource.kubernetes.io/pcieRoot"
