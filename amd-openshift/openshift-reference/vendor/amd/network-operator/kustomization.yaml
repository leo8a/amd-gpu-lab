---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00_amd-network-cs.yaml
  - 01_amd-network-ns.yaml
  - 02_amd-network-og.yaml
  - 03_amd-network-sub.yaml
  - 04_amd-ionic-blacklist.yaml
  - 05_amd-disable-acs.yaml

  # TODO: Enable RDMA exclusive namespace mode (ib_core.netns_mode=0).
  # Without this, pods see ALL RDMA devices on the node instead of only the assigned one.
  # Requires the `rdma` CNI plugin in the NAD plugin chain ({"type": "rdma"}) to move RDMA
  # devices into the pod network namespace — but the rdma binary is not shipped in the
  # k8s-cni-plugins image, and NADs need to be updated to include it.
  # - 06_rdma-namespace-mode.yaml

  - 07_amd-networkconfig.yaml
  - 08_amd-device-plugin-config.yaml


# -----------------------------------------------------------------------------
# Operator Releases
# -----------------------------------------------------------------------------
patches:
  - target:
      kind: CatalogSource
      name: amd-network-operators
    patch: |-
      - op: replace
        path: /spec/image
        value: quay.io/lochoa/rocm/amd-network-operator-catalog:main
