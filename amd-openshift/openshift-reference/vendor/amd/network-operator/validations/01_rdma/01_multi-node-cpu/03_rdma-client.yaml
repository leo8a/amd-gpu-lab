---
apiVersion: batch/v1
kind: Job
metadata:
  name: rdma-client-cpu
  namespace: openshift-amd-network
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: amd-rdma-net
      labels:
        app: rdma-test
        role: client
    spec:
      serviceAccountName: rdma-validator
      restartPolicy: Never
      nodeSelector:
        feature.node.kubernetes.io/amd-nic: "true"
      containers:
        - name: client
          image: quay.io/lochoa/amd-tools:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              echo "=== RDMA Multi-Node Bandwidth Validation ==="

              echo "--- configuring IP from NIC VLAN ---"
              PCI=$(readlink /sys/class/net/net1/device 2>/dev/null | xargs basename)
              case "$PCI" in
                # smc6216/smc6217 (Supermicro MI325X)
                0000:09:00.0) SUBNET=101 ;; 0000:19:00.0) SUBNET=102 ;;
                0000:79:00.0) SUBNET=103 ;; 0000:69:00.0) SUBNET=104 ;;
                0000:89:00.0) SUBNET=105 ;; 0000:99:00.0) SUBNET=106 ;;
                0000:f9:00.0) SUBNET=107 ;;
                # dell-mi355x-3/dell-mi355x-4 (Dell MI355X)
                0000:06:00.0) SUBNET=101 ;; 0000:3a:00.0) SUBNET=102 ;;
                0000:ac:00.0) SUBNET=103 ;; 0000:d9:00.0) SUBNET=104 ;;
                0001:06:00.0) SUBNET=105 ;; 0001:38:00.0) SUBNET=106 ;;
                0001:a9:00.0) SUBNET=107 ;; 0001:d6:00.0) SUBNET=108 ;;
                *) echo "FAIL: unknown PCI $PCI"; exit 1 ;;
              esac
              case "$NODE_NAME" in
                *6216*) OCTET=11 ;; *6217*) OCTET=12 ;;
                *mi355x-3*) OCTET=10 ;; *mi355x-4*) OCTET=20 ;;
                *) echo "FAIL: unknown node $NODE_NAME"; exit 1 ;;
              esac
              CLIENT_IP="192.168.${SUBNET}.${OCTET}"
              ip addr flush dev net1 2>/dev/null || true
              ip addr add "${CLIENT_IP}/24" dev net1
              ip link set net1 up
              GW="192.168.${SUBNET}.254"
              for s in $(seq 101 108); do
                [ "$s" = "$SUBNET" ] && continue
                ip route add "192.168.${s}.0/24" via "$GW" dev net1 2>/dev/null || true
              done
              echo "Client IP: $CLIENT_IP (PCI: $PCI, VLAN: $SUBNET)"

              echo "--- RDMA device ---"
              RDMA_DEV=$(ibv_devices 2>/dev/null | awk '/ionic/{print $1}' | head -1)
              if [ -z "$RDMA_DEV" ]; then
                echo "FAIL: No ionic RDMA device assigned to pod"
                ibv_devices 2>&1
                exit 1
              fi
              echo "Using: $RDMA_DEV"
              ibv_devinfo -d $RDMA_DEV 2>&1

              echo "--- finding server ---"
              sleep 15
              case "$OCTET" in
                11) SERVER_OCTET=12 ;; 12) SERVER_OCTET=11 ;;
                10) SERVER_OCTET=20 ;; 20) SERVER_OCTET=10 ;;
              esac
              SERVER_IP=""
              for s in $(seq 101 108); do
                TARGET="192.168.${s}.${SERVER_OCTET}"
                if ping -c 1 -W 1 $TARGET >/dev/null 2>&1; then
                  SERVER_IP=$TARGET
                  break
                fi
              done
              if [ -z "$SERVER_IP" ]; then
                echo "FAIL: Server not found"
                exit 1
              fi
              echo "Server IP: $SERVER_IP"

              echo "--- ib_write_bw test ---"
              echo "Client: $CLIENT_IP -> Server: $SERVER_IP (device: $RDMA_DEV)"
              ib_write_bw -d $RDMA_DEV -i 1 -F -x 1 -q 8 -p 10000 \
                --tclass 96 --report_gbits -s 1048576 -D 10 \
                -l 64 -t 4096 -Q 1 $SERVER_IP
              if [ $? -ne 0 ]; then
                echo "FAIL: ib_write_bw failed"
                exit 1
              fi
              echo "=== PASS ==="
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              amd.com/nic: "1"
            limits:
              cpu: 100m
              memory: 256Mi
              amd.com/nic: "1"
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "NET_RAW", "NET_ADMIN"]
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: role
                    operator: In
                    values: ["server"]
              topologyKey: kubernetes.io/hostname
